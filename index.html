<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<meta name="description" content="Small tools that run in your browser. Nothing is uploaded.">
<style>
  :root { color-scheme: light dark; --bg: #eef1f4; --ink: #0f1720; --muted: #5d6975; --accent: #ff5a1f; --panel: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161c; --ink: #eef1f4; --muted: #9aa7b4; --panel: #1a222b; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 40px; margin: 0 0 6px; }
  p.lede { color: var(--muted); margin: 0 0 32px; }
  a.card { display: block; background: var(--panel); border: 2px solid var(--ink); padding: 18px 20px; margin-bottom: 16px; color: inherit; text-decoration: none; box-shadow: 5px 5px 0 var(--ink); }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); box-shadow: 5px 5px 0 var(--accent); outline: none; }
  a.card b { display: block; font-size: 20px; }
  a.card span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p class="lede">Small tools that run in your browser. Nothing is uploaded.</p>
  <a class="card" href="pdf-to-word/"><b>PDF to Word</b><span>Drop a PDF, get an editable .docx with headings, lists and tables intact.</span></a>
</main>
</body>
</html>
